  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;feature-page-proposals&quot; class=&quot;viz-root proposal-root&quot; data-preview-theme=&quot;light&quot;&gt;
  &lt;style&gt;
    #feature-page-proposals {
      --background: #f4f4ee;
      --foreground: #1c2922;
      --card: #fcfcf8;
      --card-foreground: #1c2922;
      --primary: #397458;
      --primary-foreground: #f8fbf8;
      --secondary: #ecefe8;
      --secondary-foreground: #1c2922;
      --muted: #e7ebe5;
      --muted-foreground: #627068;
      --accent: #dcebe1;
      --accent-foreground: #2e6049;
      --destructive: #964e48;
      --border: #d8ded6;
      --input: #7d8b82;
      --ring: #397458;
      --viz-series-1: #397458;
      --viz-series-2: #587987;
      --viz-series-3: #a8783c;
      --viz-series-4: #a95f55;
      --spacing-1: 0.25rem;
      --spacing-2: 0.5rem;
      --spacing-3: 0.75rem;
      --spacing-4: 1rem;
      --spacing-5: 1.5rem;
      --spacing-6: 2rem;
      --spacing-7: 3rem;
      --spacing-8: 4rem;
      position: relative;
      isolation: isolate;
      min-height: 100%;
      color: var(--foreground);
      background: var(--background);
      overflow: hidden;
      transition: color 180ms ease, background-color 180ms ease;
    }

    #feature-page-proposals[data-preview-theme=&quot;dark&quot;] {
      --background: #18201c;
      --foreground: #eff1ec;
      --card: #202a25;
      --card-foreground: #eff1ec;
      --primary: #7fb08f;
      --primary-foreground: #142019;
      --secondary: #29342e;
      --secondary-foreground: #eff1ec;
      --muted: #29342e;
      --muted-foreground: #aab5ad;
      --accent: #263b30;
      --accent-foreground: #9bc2a6;
      --destructive: #e09990;
      --border: #34423a;
      --input: #718279;
      --ring: #7fb08f;
      --viz-series-1: #7fb08f;
      --viz-series-2: #83a2ad;
      --viz-series-3: #c7a063;
      --viz-series-4: #d48779;
    }

    #feature-page-proposals * {
      box-sizing: border-box;
    }

    #feature-page-proposals .pointer-halo {
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(680px circle at var(--halo-x, 50%) var(--halo-y, 22%), color-mix(in srgb, var(--primary) 7%, transparent), transparent 70%);
    }

    #feature-page-proposals[data-preview-theme=&quot;dark&quot;] .pointer-halo {
      background: radial-gradient(680px circle at var(--halo-x, 50%) var(--halo-y, 22%), color-mix(in srgb, var(--primary) 9%, transparent), transparent 70%);
    }

    #feature-page-proposals .preview-toolbar,
    #feature-page-proposals .product-nav,
    #feature-page-proposals .page-head,
    #feature-page-proposals .section-head,
    #feature-page-proposals .row-between,
    #feature-page-proposals .metric-head,
    #feature-page-proposals .meal-row,
    #feature-page-proposals .story-row,
    #feature-page-proposals .session-row,
    #feature-page-proposals .composer,
    #feature-page-proposals .assistant-context-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-4);
    }

    #feature-page-proposals .preview-toolbar {
      position: relative;
      z-index: 2;
      padding: var(--spacing-4) clamp(var(--spacing-4), 4vw, var(--spacing-7));
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--background) 92%, transparent);
      flex-wrap: wrap;
    }

    #feature-page-proposals .screen-tabs {
      display: flex;
      gap: var(--spacing-2);
      flex-wrap: wrap;
    }

    #feature-page-proposals .product-nav {
      position: relative;
      z-index: 1;
      padding: var(--spacing-4) clamp(var(--spacing-4), 4vw, var(--spacing-7));
      border-bottom: 1px solid var(--border);
    }

    #feature-page-proposals .brand,
    #feature-page-proposals .nav-links,
    #feature-page-proposals .inline-actions,
    #feature-page-proposals .legend,
    #feature-page-proposals .topic-tabs {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      flex-wrap: wrap;
    }

    #feature-page-proposals .brand-mark {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 46% 54% 48% 52%;
      color: var(--primary-foreground);
      background: var(--primary);
      font-weight: 500;
    }

    #feature-page-proposals .nav-link {
      color: var(--muted-foreground);
    }

    #feature-page-proposals .nav-link.is-active {
      color: var(--foreground);
      font-weight: 500;
    }

    #feature-page-proposals .screen {
      display: none;
      width: min(100%, 1240px);
      min-height: 45rem;
      margin: 0 auto;
      padding: var(--spacing-7) clamp(var(--spacing-4), 4vw, var(--spacing-7)) var(--spacing-8);
    }

    #feature-page-proposals .screen.is-active {
      display: block;
    }

    #feature-page-proposals .page-head {
      align-items: end;
      margin-bottom: var(--spacing-7);
    }

    #feature-page-proposals .page-copy {
      display: grid;
      gap: var(--spacing-2);
      max-width: 46rem;
    }

    #feature-page-proposals h1,
    #feature-page-proposals h2,
    #feature-page-proposals h3,
    #feature-page-proposals p {
      margin: 0;
    }

    #feature-page-proposals .subtle,
    #feature-page-proposals .meta,
    #feature-page-proposals .page-copy p,
    #feature-page-proposals .context-label,
    #feature-page-proposals .meal-row p,
    #feature-page-proposals .story-row p,
    #feature-page-proposals .session-row p {
      color: var(--muted-foreground);
    }

    #feature-page-proposals .section {
      margin-top: var(--spacing-7);
    }

    #feature-page-proposals .section-head {
      align-items: end;
      margin-bottom: var(--spacing-4);
    }

    #feature-page-proposals .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(18rem, 0.85fr);
      gap: var(--spacing-6);
      align-items: start;
    }

    #feature-page-proposals .equal-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--spacing-6);
      align-items: start;
    }

    #feature-page-proposals .stack {
      display: grid;
      gap: var(--spacing-4);
    }

    #feature-page-proposals .stack-roomy {
      display: grid;
      gap: var(--spacing-6);
    }

    #feature-page-proposals .assistant-workspace {
      min-height: 34rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: var(--spacing-6);
    }

    #feature-page-proposals .assistant-welcome {
      display: grid;
      place-content: center;
      gap: var(--spacing-5);
      max-width: 44rem;
      margin: auto;
      text-align: center;
    }

    #feature-page-proposals .assistant-mark {
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      margin: 0 auto;
      border-radius: 50%;
      color: var(--accent-foreground);
      background: var(--accent);
    }

    #feature-page-proposals .prompt-list {
      display: grid;
      gap: 1px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--border);
      text-align: left;
    }

    #feature-page-proposals .prompt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-4);
      padding: var(--spacing-4);
      color: var(--foreground);
      background: var(--card);
    }

    #feature-page-proposals .composer {
      align-items: stretch;
    }

    #feature-page-proposals .composer .form-control {
      flex: 1 1 auto;
    }

    #feature-page-proposals .context-list {
      display: grid;
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #feature-page-proposals .assistant-context-row {
      padding: var(--spacing-3) 0;
      background: var(--background);
    }

    #feature-page-proposals .editorial-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(18rem, 0.75fr);
      gap: var(--spacing-7);
      align-items: stretch;
    }

    #feature-page-proposals .featured-story {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(15rem, 0.9fr);
      min-height: 26rem;
      overflow: hidden;
    }

    #feature-page-proposals .story-copy {
      display: grid;
      align-content: end;
      gap: var(--spacing-4);
      padding: var(--spacing-6);
    }

    #feature-page-proposals .story-art {
      display: grid;
      place-items: center;
      min-height: 18rem;
      color: var(--primary);
      background: var(--accent);
    }

    #feature-page-proposals .story-art svg {
      width: min(75%, 16rem);
      height: auto;
    }

    #feature-page-proposals .story-list,
    #feature-page-proposals .meal-list,
    #feature-page-proposals .session-list {
      display: grid;
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #feature-page-proposals .story-row,
    #feature-page-proposals .meal-row,
    #feature-page-proposals .session-row {
      align-items: start;
      padding: var(--spacing-4) 0;
      background: var(--background);
    }

    #feature-page-proposals .story-main,
    #feature-page-proposals .meal-main,
    #feature-page-proposals .session-main {
      display: grid;
      gap: var(--spacing-1);
      flex: 1 1 auto;
    }

    #feature-page-proposals .category {
      color: var(--primary);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #feature-page-proposals .training-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(16rem, 0.75fr);
      gap: var(--spacing-6);
      background: linear-gradient(125deg, var(--accent), color-mix(in srgb, var(--accent) 82%, var(--viz-series-2)));
    }

    #feature-page-proposals .next-session,
    #feature-page-proposals .week-schedule,
    #feature-page-proposals .nutrition-summary,
    #feature-page-proposals .macro-summary {
      display: grid;
      gap: var(--spacing-5);
    }

    #feature-page-proposals .schedule-days {
      display: grid;
      gap: var(--spacing-2);
    }

    #feature-page-proposals .schedule-day {
      display: grid;
      grid-template-columns: 3rem 1fr auto;
      align-items: center;
      gap: var(--spacing-3);
      padding-block: var(--spacing-2);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 74%, transparent);
    }

    #feature-page-proposals .coverage-layout,
    #feature-page-proposals .anatomy-layout {
      display: grid;
      grid-template-columns: minmax(15rem, 0.9fr) minmax(0, 1.1fr);
      gap: var(--spacing-7);
      align-items: center;
    }

    #feature-page-proposals .body-map {
      display: block;
      width: min(100%, 18rem);
      max-height: 27rem;
      margin: auto;
    }

    #feature-page-proposals .body-base {
      fill: color-mix(in srgb, var(--muted-foreground) 52%, transparent);
    }

    #feature-page-proposals .body-line {
      fill: none;
      stroke: var(--background);
      stroke-width: 2;
    }

    #feature-page-proposals .muscle-good { fill: var(--viz-series-1); }
    #feature-page-proposals .muscle-low { fill: var(--viz-series-3); }
    #feature-page-proposals .muscle-selected { fill: var(--viz-series-4); }

    #feature-page-proposals .coverage-notes {
      display: grid;
      gap: var(--spacing-4);
    }

    #feature-page-proposals .coverage-note {
      display: grid;
      grid-template-columns: 0.75rem 1fr auto;
      align-items: center;
      gap: var(--spacing-3);
      padding-bottom: var(--spacing-3);
      border-bottom: 1px solid var(--border);
    }

    #feature-page-proposals .dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--viz-series-1);
    }

    #feature-page-proposals .coverage-note:nth-child(2) .dot { background: var(--viz-series-3); }
    #feature-page-proposals .coverage-note:nth-child(3) .dot { background: var(--muted-foreground); }

    #feature-page-proposals .metric {
      display: grid;
      gap: var(--spacing-2);
    }

    #feature-page-proposals .track {
      height: 0.55rem;
      border-radius: var(--radius-full);
      background: var(--muted);
      overflow: hidden;
    }

    #feature-page-proposals .track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--viz-series-1);
    }

    #feature-page-proposals .metric.protein .track span { width: 64%; background: var(--viz-series-2); }
    #feature-page-proposals .metric.carbs .track span { width: 58%; background: var(--viz-series-3); }
    #feature-page-proposals .metric.fat .track span { width: 72%; background: var(--viz-series-1); }
    #feature-page-proposals .metric.energy .track span { width: 62%; }

    #feature-page-proposals .energy-number {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-2);
    }

    #feature-page-proposals .energy-number strong {
      color: var(--primary);
      font-weight: 500;
    }

    #feature-page-proposals .chart {
      display: block;
      width: 100%;
      height: auto;
    }

    #feature-page-proposals .chart-grid {
      stroke: var(--border);
      stroke-width: 1;
    }

    #feature-page-proposals .chart-goal {
      stroke: var(--viz-series-3);
      stroke-width: 1.5;
      stroke-dasharray: 5 5;
    }

    #feature-page-proposals .chart-bar { fill: var(--viz-series-1); }
    #feature-page-proposals .chart-over { fill: var(--viz-series-3); }
    #feature-page-proposals .chart-text { fill: var(--muted-foreground); }

    #feature-page-proposals .anatomy-controls {
      display: grid;
      gap: var(--spacing-3);
    }

    #feature-page-proposals .muscle-detail {
      display: grid;
      gap: var(--spacing-5);
    }

    #feature-page-proposals .detail-section {
      display: grid;
      gap: var(--spacing-2);
      padding-bottom: var(--spacing-4);
      border-bottom: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      #feature-page-proposals .two-col,
      #feature-page-proposals .equal-col,
      #feature-page-proposals .editorial-grid,
      #feature-page-proposals .featured-story,
      #feature-page-proposals .training-hero,
      #feature-page-proposals .coverage-layout,
      #feature-page-proposals .anatomy-layout {
        grid-template-columns: 1fr;
      }

      #feature-page-proposals .nav-links {
        display: none;
      }

      #feature-page-proposals .story-art {
        min-height: 14rem;
      }
    }

    @media (max-width: 560px) {
      #feature-page-proposals .preview-toolbar,
      #feature-page-proposals .product-nav,
      #feature-page-proposals .page-head,
      #feature-page-proposals .section-head,
      #feature-page-proposals .composer,
      #feature-page-proposals .meal-row,
      #feature-page-proposals .story-row,
      #feature-page-proposals .session-row {
        align-items: stretch;
        flex-direction: column;
      }

      #feature-page-proposals .screen-tabs,
      #feature-page-proposals .screen-tabs .btn,
      #feature-page-proposals .page-head .btn,
      #feature-page-proposals .composer .btn {
        width: 100%;
      }

      #feature-page-proposals .schedule-day {
        grid-template-columns: 2.5rem 1fr;
      }

      #feature-page-proposals .schedule-day &gt; :last-child {
        grid-column: 2;
      }
    }

    @media (hover: none), (prefers-reduced-motion: reduce) {
      #feature-page-proposals .pointer-halo { display: none; }
    }
  &lt;/style&gt;

  &lt;script&gt;
    (() =&gt; {

      const buttons = [...root.querySelectorAll(&#x27;[data-screen-button]&#x27;)];
      const screens = [...root.querySelectorAll(&#x27;[data-screen]&#x27;)];
      const themeButton = root.querySelector(&#x27;[data-theme-toggle]&#x27;);
      let frame = null;

      buttons.forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.dataset.screenButton;
          buttons.forEach(item =&gt; item.classList.toggle(&#x27;btn-primary&#x27;, item === button));
          screens.forEach(screen =&gt; screen.classList.toggle(&#x27;is-active&#x27;, screen.dataset.screen === target));
          root.querySelector(&#x27;.product-nav .nav-link.is-active&#x27;)?.classList.remove(&#x27;is-active&#x27;);
          const labels = { assistant: &#x27;Blog&#x27;, blog: &#x27;Blog&#x27;, training: &#x27;Training&#x27;, nutrition: &#x27;Nutrition&#x27;, anatomy: &#x27;Training&#x27; };
          [...root.querySelectorAll(&#x27;.nav-link&#x27;)].find(link =&gt; link.textContent === labels[target])?.classList.add(&#x27;is-active&#x27;);
        });
      });

      themeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const dark = root.dataset.previewTheme === &#x27;dark&#x27;;
        root.dataset.previewTheme = dark ? &#x27;light&#x27; : &#x27;dark&#x27;;
        themeButton.textContent = dark ? &#x27;Switch to dark&#x27; : &#x27;Switch to light&#x27;;
      });

      root.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        if (frame) return;
        frame = requestAnimationFrame(() =&gt; {
          const rect = root.getBoundingClientRect();
          root.style.setProperty(&#x27;--halo-x&#x27;, `${event.clientX - rect.left}px`);
          root.style.setProperty(&#x27;--halo-y&#x27;, `${event.clientY - rect.top}px`);
          frame = null;
        });
      });

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

})();
&lt;/script&gt;
