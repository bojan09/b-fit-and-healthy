<!DOCTYPE html>
<html lang="mk" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FA">
  <meta name="description" content="Б Фит и Здрав — оперативен систем за здрав живот. Исхрана, тренинг, навики и знаење на едно место.">
  <title>Б Фит и Здрав</title>

  <!-- Theme is resolved BEFORE first paint so there is never a flash. -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("bfit.theme") || "system";
        var dark = pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0B1220" : "#F4F7FA");
        var lang = localStorage.getItem("bfit.lang") || "mk";
        document.documentElement.lang = lang;
        if (localStorage.getItem("bfit.reducedMotion") === "1") {
          document.documentElement.setAttribute("data-reduced-motion", "true");
        }
      } catch (e) { /* private mode — fall back to the markup defaults */ }
    })();
  </script>

  <!-- Cyrillic-complete free faces. The app degrades to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded non-blocking: if the CDN is slow or unreachable the app still paints. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/motion.css">
  <!-- The real mark, supplied by the project (16/32/48px). -->
  <link rel="icon" href="favicon.ico" sizes="any">
</head>

<body>
  <a class="skip-link" href="#main">Прескокни до содржината / Skip to content</a>

  <div id="root"></div>
  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Plain scripts, no modules: the prototype opens straight from the filesystem. -->
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/shader.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/data.js"></script>
  <script src="js/records.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/screens-public.js"></script>
  <script src="js/screens-app.js"></script>
  <script src="js/screens-records.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
