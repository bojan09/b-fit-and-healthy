<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>B-Fit viewport audit</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.45 ui-monospace, monospace; background: #ddd; }
  pre { white-space: pre-wrap; max-width: 760px; padding: 12px; background: white; }
  iframe { display: block; border: 2px solid #111; background: white; }
</style>
<pre id="report">Waiting for route…</pre>
<iframe id="preview" title="Exact-width route preview"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const width = Number(params.get('width')) || 375;
  const route = params.get('route') || 'today';
  const frame = document.getElementById('preview');
  frame.width = String(width);
  frame.height = '900';
  frame.src = `../prototype/index.html#/${route}`;
  frame.addEventListener('load', () => setTimeout(() => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const offenders = [...doc.querySelectorAll('body *')].filter((element) => {
      const rect = element.getBoundingClientRect();
      return rect.right > win.innerWidth + 1 || rect.left < -1;
    }).slice(0, 20).map((element) => ({
      element: element.tagName.toLowerCase() + (element.className ? '.' + String(element.className).trim().replace(/\s+/g, '.') : ''),
      left: Math.round(element.getBoundingClientRect().left),
      right: Math.round(element.getBoundingClientRect().right)
    }));
    const result = {
      route,
      requestedWidth: width,
      innerWidth: win.innerWidth,
      documentWidth: doc.documentElement.scrollWidth,
      bodyWidth: doc.body.scrollWidth,
      horizontalOverflow: doc.documentElement.scrollWidth > win.innerWidth + 1,
      offenders
    };
    document.getElementById('report').textContent = JSON.stringify(result, null, 2);
    document.title = result.horizontalOverflow ? `FAIL ${route} ${width}` : `PASS ${route} ${width}`;
  }, 500), { once: true });
</script>
</html>
